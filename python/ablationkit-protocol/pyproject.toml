[project]
name = "ablationkit-protocol"
version = "0.1.0"
description = "Versioned AblationKit protocol models, generated from packages/protocol JSON Schemas."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "typing-extensions>=4.6; python_version < '3.11'"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
