[project]
name = "ablationkit-worker"
version = "0.1.0"
description = "Dependency-free AblationKit remote worker: runs a staged run bundle, spools events and artifacts durably, and reconciles with the coordinator when it is reachable."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
