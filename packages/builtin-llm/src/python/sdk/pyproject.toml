[project]
name = "ablationkit-llm"
version = "0.1.0"
description = "Optional, provider-neutral LLM helpers for AblationKit projects: traces with LLM, retrieval and tool spans, OpenAI-compatible calls with reported usage, golden sets and pinned prompts."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["ablationkit-sdk"]

[tool.uv.sources]
ablationkit-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
